<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Apples</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <!-- Left Side -->
        <div class="left">

            <div class="icons">
                <span>↗</span>
                <span>♡</span>
            </div>

            <img class="main-img"
                 src=andrey-haimin-lKWL2esVNlQ-unsplash.jpg
                 alt="Apple">

            <div class="thumbnails">
                <img src=tobi-zLCR7RsxYGs-unsplash.jpg>
                <img src=icons8-red-apple-48.png>
                <img src=icons8-apple-fruit-25.png>
                <img src=icons8-green-apple-48.png>
            </div>

        </div>


        <!-- Right Side -->
        <div class="right">

            <h1>Delicious Apples</h1>

            <p class="code">COD: 45999</p>

            <div class="price">
                <small>RS</small> 793
            </div>

            <p class="select">SELECT A COLOR</p>

            <div class="colors">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="benefit-title">BENEFITS</p>

            <ul>
                <li>Apples are nutritious</li>
                <li>Apples may be good for weight loss</li>
                <li>Apples may be good for bone health</li>
                <li>They're linked to a lower risk of diabetes</li>
            </ul>

            <button>ADD TO CART</button>

        </div>

    </div>


    

</body>
</html>
